name: Collecte quotidienne + envoi de la veille

on:
  schedule:
    # Tous les jours a 07h30 UTC = 08h30 heure du Maroc (UTC+1)
    - cron: "30 7 * * *"
  workflow_dispatch: {}  # bouton "Run workflow" pour lancer a la demande

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer la collecte
        run: python build.py

      - name: Publier les nouvelles donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.json docs/data/filters.json docs/data/meta.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte automatique $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Envoyer la veille du jour par e-mail
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "Cle Brevo absente — envoi ignore (a configurer dans Settings > Secrets)."
            exit 0
          fi
          python send_digest.py
